<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お客様用リンクとQRをつくる（スタッフ用）</title><meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<script src="qrcode.min.js"></script>
<style>body{font:16px/1.7 "Hiragino Sans",sans-serif;max-width:640px;margin:0 auto;padding:16px;background:#f6f4ef;color:#1d2430}label{display:block;margin:12px 0 4px;font-weight:700}input,select{width:100%;font:inherit;padding:10px;border:2px solid #e1ddd2;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row label{flex:1;min-width:140px;font-weight:600}button{margin-top:14px;min-height:50px;width:100%;border:0;border-radius:12px;background:#1f7a5c;color:#fff;font:inherit;font-weight:800}
#out{margin-top:16px;word-break:break-all;background:#fff;border:1px solid #e1ddd2;border-radius:12px;padding:12px}.note{color:#5f6b7a;font-size:14px}</style></head><body>
<h1>お客様用リンクとQRをつくる</h1><p class="note">作業が終わったら、このリンク（またはQR）をお客様に見せます。担当者・予約経路などが自動で入るので、お客様は入力しなくて済みます。</p>
<label>フォームのURL（公開したアドレス）</label><input id="base" placeholder="https://（あなたのID）.github.io/quality-form/">
<div class="row"><label>受付番号<input id="job"></label><label>担当者<input id="staff"></label></div>
<div class="row"><label>予約経路<select id="src"><option></option><option>ユアマイスター</option><option>ホームページ</option><option>くらしのマーケット</option><option>直接（電話・LINE・メールなど）</option><option>その他</option></select></label><label>案件先<input id="site"></label></div>
<div class="row"><label>住宅<select id="house"><option></option><option>マンション・アパート</option><option>戸建て</option><option>その他</option></select></label><label>都道府県<input id="area"></label><label>金額（円・任意）<input id="amt" inputmode="numeric"></label></div>
<label>実施した作業（チェックした作業だけ、お客様に聞きます）</label><div class="row"><label><input type="checkbox" class="svc" value="wipe" checked style="width:auto"> 乾拭き</label><label><input type="checkbox" class="svc" value="curtain" checked style="width:auto"> カーテン・家具</label><label><input type="checkbox" class="svc" value="drain" checked style="width:auto"> 排水溝・換気扇</label><label><input type="checkbox" class="svc" value="toilet" checked style="width:auto"> トイレ</label></div>
<button id="mk">リンクとQRをつくる</button><div id="out" hidden><div id="url"></div><div id="qr" style="margin-top:10px"></div></div>
<script src="link-maker.js"></script></body></html>
